<!DOCTYPE html>
<html lang="en">
<head>
    <title>Add Category | Admin — Local SME PNG</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/quicksand@5.0.0/index.min.css">
    <link rel="stylesheet" href="../../../css/custom.css" />
    <link rel="shortcut icon" type="icon/ico" href="../../../icon/favicon.ico" />
</head>
<body data-root="../../../" data-admin="true">

    <div class="container-fluid px-3 px-md-5">
        <div class="row justify-content-center">
            <div class="col-md-12">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item">Admin Panel</li>
                    <li class="breadcrumb-item"><a href="../index.html" style="color:#3fa33d;">Categories</a></li>
                    <li class="breadcrumb-item active">New Category</li>
                </ol>
            </div>

            <section class="page-hero mb-5">
                <div class="row align-items-center">
                    <div class="col-md-8 text-center text-md-start">
                        <span class="hero-eyebrow-gold"><i class="bi bi-bookmark-plus-fill me-2"></i>New Category</span>
                        <h1 class="display-5 fw-bold">Add a <span class="text-white">Category</span></h1>
                        <p class="lead hero-lead"><i class="bi bi-tags me-2" style="color:#3fa33d;"></i>Group your products under a clear, browsable category.</p>
                    </div>
                    <div class="col-md-4 text-center mt-4 mt-md-0"><div class="hero-blob blob-200"><i class="bi bi-bookmark-plus icon-5"></i></div></div>
                </div>
            </section>

            <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
                <a href="../index.html" role="button" class="btn btn-pill-dark btn-sm"><i class="bi bi-arrow-left"></i>&nbsp;Back to Categories</a>
            </div>

            <div class="row justify-content-center">
                <div class="col-md-9">
                    <div class="surface-card card-pad">
                        <form class="admin-form" data-redirect="admin/categories/index.html" id="categoryAddForm">

                            <h6 class="form-section-heading text-green"><i class="bi bi-bookmark-fill"></i>Category Details</h6>

                            <div class="row g-3 mb-4">
                                <div class="col-md-4">
                                    <label>Category Code&nbsp;<i class="bi bi-asterisk required"></i></label>
                                    <input type="text" class="form-control" placeholder="e.g. ACCS" maxlength="10" style="font-family:'Courier New',monospace;text-transform:uppercase;" required>
                                    <small class="text-muted d-block mt-1"><i class="bi bi-info-circle me-1"></i>Short unique code, max 10 characters.</small>
                                </div>
                                <div class="col-md-8">
                                    <label>Category Name&nbsp;<i class="bi bi-asterisk required"></i></label>
                                    <input type="text" class="form-control" placeholder="e.g. Accessories" required>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label>Description&nbsp;<i class="bi bi-asterisk required"></i></label>
                                <textarea class="form-control" rows="6" placeholder="What products belong in this category?" required></textarea>
                                <small class="text-muted d-block mt-1"><i class="bi bi-info-circle me-1"></i>Helpful for customers browsing the catalogue.</small>
                            </div>

                            <div class="row g-2 mt-4">
                                <div class="col-md-6"><button type="submit" class="btn btn-pill-green btn-block py-3">Create Category&nbsp;<i class="bi bi-plus-circle ms-1"></i></button></div>
                                <div class="col-md-6"><a href="../index.html" class="btn btn-pill-dark btn-block py-3">Cancel&nbsp;<i class="bi bi-x-circle ms-1"></i></a></div>
                            </div>

                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="../../../js/top-scroll.js"></script>
    <script src="../../../js/demo-cart.js"></script>
    <script src="../../../js/custom.js"></script>
    <script src="../../../js/admin-nav.js"></script>
    <script src="../../../js/quick-links.js"></script>

</body>
</html>
