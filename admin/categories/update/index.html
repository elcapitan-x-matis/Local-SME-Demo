<!DOCTYPE html>
<html lang="en">
<head>
    <title>Edit Category | Admin — Local SME PNG</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/quicksand@5.0.0/index.min.css">
    <link rel="stylesheet" href="../../../css/custom.css" />
    <link rel="shortcut icon" type="icon/ico" href="../../../icon/favicon.ico" />
</head>
<body data-root="../../../" data-admin="true">

    <div class="container-fluid px-3 px-md-5">
        <div class="row justify-content-center">
            <div class="col-md-12">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item">Admin Panel</li>
                    <li class="breadcrumb-item"><a href="../index.html" style="color:#3fa33d;">Categories</a></li>
                    <li class="breadcrumb-item"><a href="../view/index.html" style="color:#3fa33d;" id="bcCat">Category</a></li>
                    <li class="breadcrumb-item active">Edit</li>
                </ol>
            </div>

            <section class="page-hero mb-5">
                <div class="row align-items-center">
                    <div class="col-md-8 text-center text-md-start">
                        <span class="hero-eyebrow-gold"><i class="bi bi-pencil-square me-2"></i>Editing Category</span>
                        <h1 class="display-5 fw-bold">Update <span class="text-white" id="heroName">Category</span></h1>
                        <p class="lead hero-lead"><i class="bi bi-tag-fill me-2" style="color:#3fa33d;"></i>
                            <span class="pill-category-gold" style="font-family:'Courier New',monospace;font-size:0.85rem;" id="heroCode">CODE</span>
                        </p>
                    </div>
                    <div class="col-md-4 text-center mt-4 mt-md-0"><div class="hero-blob blob-200"><i class="bi bi-pencil icon-5"></i></div></div>
                </div>
            </section>

            <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
                <a href="../view/index.html" role="button" class="btn btn-pill-dark btn-sm" id="backToCat"><i class="bi bi-arrow-left"></i>&nbsp;Back to Category</a>
                <button type="button" class="btn btn-pill-gold-outline btn-sm admin-remove-btn" data-redirect="admin/categories/index.html" title="Delete category"><i class="bi bi-trash me-1"></i>Delete Category</button>
            </div>

            <div class="row justify-content-center">
                <div class="col-md-9">
                    <div class="surface-card card-pad">
                        <form class="admin-form" data-redirect="admin/categories/index.html" id="categoryUpdateForm">

                            <h6 class="form-section-heading text-green"><i class="bi bi-bookmark-fill"></i>Edit Category Details</h6>

                            <div class="row g-3 mb-4">
                                <div class="col-md-4">
                                    <label>Category Code&nbsp;<i class="bi bi-asterisk required"></i></label>
                                    <input type="text" id="inCode" class="form-control" maxlength="10" style="font-family:'Courier New',monospace;text-transform:uppercase;" required>
                                    <small class="text-muted d-block mt-1"><i class="bi bi-exclamation-triangle me-1" style="color:#edb400;"></i>Changing the code may affect linked products.</small>
                                </div>
                                <div class="col-md-8">
                                    <label>Category Name&nbsp;<i class="bi bi-asterisk required"></i></label>
                                    <input type="text" id="inName" class="form-control" required>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label>Description&nbsp;<i class="bi bi-asterisk required"></i></label>
                                <textarea id="inDesc" class="form-control" rows="6" required></textarea>
                                <small class="text-muted d-block mt-1"><i class="bi bi-info-circle me-1"></i>Helpful for customers browsing the catalogue.</small>
                            </div>

                            <div class="row g-2 mt-4">
                                <div class="col-md-6"><button type="submit" class="btn btn-pill-green btn-block py-3">Save Changes&nbsp;<i class="bi bi-save ms-1"></i></button></div>
                                <div class="col-md-6"><a href="../index.html" class="btn btn-pill-dark btn-block py-3">Cancel&nbsp;<i class="bi bi-x-circle ms-1"></i></a></div>
                            </div>

                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="../../../js/top-scroll.js"></script>
    <script src="../../../js/demo-cart.js"></script>
    <script src="../../../js/custom.js"></script>
    <script src="../../../js/admin-nav.js"></script>

    <script>
    // Demo category data (mirrors the categories list page)
    const CATEGORIES = {
        FOOD: { code: 'FOOD', name: 'Food & Drink', description: 'Local coffee, honey, seasonal produce, and artisan pantry goods.' },
        FASH: { code: 'FASH', name: 'Fashion', description: 'Hand-woven bilums, shell jewellery, and traditional apparel.' },
        HOME: { code: 'HOME', name: 'Home & Living', description: 'Hand-carved bowls, clay pots, woven baskets, and home textiles.' },
        SERV: { code: 'SERV', name: 'Services', description: 'Local guides, workshops, and community experiences.' }
    };

    document.addEventListener('DOMContentLoaded', function () {
        const code = (new URLSearchParams(window.location.search).get('code') || 'FOOD').toUpperCase();
        const c = CATEGORIES[code] || CATEGORIES.FOOD;
        document.title = 'Edit ' + c.name + ' | Admin — Local SME PNG';
        document.getElementById('bcCat').textContent = c.name;
        document.getElementById('heroName').textContent = c.name;
        document.getElementById('heroCode').textContent = c.code;
        document.getElementById('inCode').value = c.code;
        document.getElementById('inName').value = c.name;
        document.getElementById('inDesc').value = c.description;
    });
    </script>

</body>
</html>
