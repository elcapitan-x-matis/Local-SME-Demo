<!DOCTYPE html>
<html lang="en">
<head>
    <title>Category Details | Admin — Local SME PNG</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/quicksand@5.0.0/index.min.css">
    <link rel="stylesheet" href="../../../css/custom.css" />
    <link rel="shortcut icon" type="icon/ico" href="../../../icon/favicon.ico" />
</head>
<body data-root="../../../" data-admin="true">

    <div class="container-fluid px-3 px-md-5">
        <div class="row justify-content-center">
            <div class="col-md-12">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item">Admin Panel</li>
                    <li class="breadcrumb-item"><a href="../index.html" style="color:#3fa33d;">Categories</a></li>
                    <li class="breadcrumb-item active" id="bcName">Category</li>
                </ol>
            </div>

            <section class="page-hero mb-5">
                <div class="row align-items-center">
                    <div class="col-md-8 text-center text-md-start">
                        <span class="hero-eyebrow-gold"><i class="bi bi-bookmark-fill me-2"></i>Category Details</span>
                        <h1 class="display-5 fw-bold" id="heroName">Category</h1>
                        <p class="lead hero-lead"><i class="bi bi-tag-fill me-2" style="color:#3fa33d;"></i>
                            <span class="pill-category-gold" style="font-family:'Courier New',monospace;font-size:0.85rem;" id="heroCode">CODE</span>
                        </p>
                    </div>
                    <div class="col-md-4 text-center mt-4 mt-md-0"><div class="hero-blob blob-200"><i class="bi bi-bookmark icon-5"></i></div></div>
                </div>
            </section>

            <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
                <a href="../index.html" role="button" class="btn btn-pill-dark btn-sm"><i class="bi bi-arrow-left"></i>&nbsp;Back to Categories</a>
                <div class="d-flex gap-2 flex-wrap">
                    <a href="../update/index.html" class="btn btn-pill-green btn-sm" id="editBtn"><i class="bi bi-pencil me-1"></i>Edit Category</a>
                    <button type="button" class="btn btn-pill-gold-outline btn-sm admin-remove-btn" data-redirect="admin/categories/index.html"><i class="bi bi-trash me-1"></i>Delete</button>
                </div>
            </div>

            <div class="row justify-content-center g-4">
                <div class="col-md-5">
                    <div class="surface-card card-pad h-100">
                        <div class="d-flex align-items-center mb-4">
                            <div class="icon-chip chip-gold"><i class="bi bi-info-circle-fill"></i></div>
                            <h4 class="ms-3 mb-0" style="color:#191919;font-weight:600;">Category Info</h4>
                        </div>
                        <ul class="detail-list">
                            <li><span class="detail-label"><i class="bi bi-hash"></i>Code</span><strong class="detail-value" style="font-family:'Courier New',monospace;" id="infoCode">—</strong></li>
                            <li><span class="detail-label"><i class="bi bi-tag"></i>Name</span><strong class="detail-value" id="infoName">—</strong></li>
                            <li><span class="detail-label"><i class="bi bi-box-seam"></i>Products</span><strong class="detail-value" id="infoCount">0</strong></li>
                        </ul>
                        <hr style="border-color:#c0d4e0;">
                        <h6 class="form-section-heading text-gold mb-3"><i class="bi bi-card-text"></i>Description</h6>
                        <p id="infoDesc" style="color:#555;line-height:1.7;font-size:0.95rem;">—</p>
                    </div>
                </div>
                <div class="col-md-7">
                    <div class="surface-card card-pad h-100">
                        <div class="d-flex align-items-center mb-4">
                            <div class="icon-chip chip-green"><i class="bi bi-box-seam"></i></div>
                            <h4 class="ms-3 mb-0" style="color:#191919;font-weight:600;">Products in this Category</h4>
                        </div>
                        <div class="table-responsive">
                            <table class="table table-styled table-hover w-100">
                                <thead>
                                    <tr><th>Product</th><th>Price</th><th class="text-center">Stock</th><th class="text-end">Actions</th></tr>
                                </thead>
                                <tbody id="catProducts"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="../../../js/top-scroll.js"></script>
    <script src="../../../js/demo-cart.js"></script>
    <script src="../../../js/custom.js"></script>
    <script src="../../../js/admin-nav.js"></script>

    <script>
    const CATEGORIES = {
        FOOD: { code: 'FOOD', name: 'Food & Drink', description: 'Local coffee, honey, seasonal produce, and artisan pantry goods.' },
        FASH: { code: 'FASH', name: 'Fashion', description: 'Hand-woven bilums, shell jewellery, and traditional apparel.' },
        HOME: { code: 'HOME', name: 'Home & Living', description: 'Hand-carved bowls, clay pots, woven baskets, and home textiles.' },
        SERV: { code: 'SERV', name: 'Services', description: 'Local guides, workshops, and community experiences.' }
    };

    document.addEventListener('DOMContentLoaded', function () {
        const code = (new URLSearchParams(window.location.search).get('code') || 'FOOD').toUpperCase();
        const c = CATEGORIES[code] || CATEGORIES.FOOD;
        document.title = c.name + ' | Admin — Local SME PNG';
        document.getElementById('bcName').textContent = c.name;
        document.getElementById('heroName').textContent = c.name;
        document.getElementById('heroCode').textContent = c.code;
        document.getElementById('infoCode').textContent = c.code;
        document.getElementById('infoName').textContent = c.name;
        document.getElementById('infoDesc').textContent = c.description;
        document.getElementById('editBtn').href = '../update/index.html?code=' + c.code;

        fetch('../../../data/products.json').then(r => r.json()).then(all => {
            const products = all.filter(p => p.category === c.name);
            document.getElementById('infoCount').textContent = products.length;

            if (!products.length) {
                document.getElementById('catProducts').innerHTML =
                    '<tr><td colspan="4" class="text-center text-muted py-4">No products in this category.</td></tr>';
                return;
            }

            document.getElementById('catProducts').innerHTML = products.map(p => `
                <tr>
                    <td>
                        <div class="d-flex align-items-center gap-2">
                            <div class="img-frame-sm"><img src="../../../${p.image}" width="40" height="40" style="object-fit:cover;" alt="${p.name}"></div>
                            <strong style="color:#191919;">${p.name}</strong>
                        </div>
                    </td>
                    <td><span style="color:#3fa33d;font-weight:600;">PGK ${p.price.toFixed(2)}</span></td>
                    <td class="text-center"><span class="pill-status-dark" style="background-color:#3fa33d;color:#fff;">${p.inventory} in stock</span></td>
                    <td class="text-end">
                        <div class="table-actions justify-content-end">
                            <a href="../../products/view/index.html?id=${p.id}" class="table-action-btn table-action-view" title="View product"><i class="bi bi-eye"></i></a>
                            <a href="../../products/update/index.html?id=${p.id}" class="table-action-btn table-action-edit" title="Edit product"><i class="bi bi-pencil"></i></a>
                        </div>
                    </td>
                </tr>
            `).join('');
        });
    });
    </script>

</body>
</html>
