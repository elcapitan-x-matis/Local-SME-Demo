<!DOCTYPE html>
<html lang="en">
<head>
    <title>Add Product | Admin — Local SME PNG</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/quicksand@5.0.0/index.min.css">
    <link rel="stylesheet" href="../../../css/custom.css" />
    <link rel="shortcut icon" type="icon/ico" href="../../../icon/favicon.ico" />
</head>
<body data-root="../../../" data-admin="true">

    <div class="container-fluid px-3 px-md-5">
        <div class="row justify-content-center">
            <div class="col-md-12">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item">Admin Panel</li>
                    <li class="breadcrumb-item"><a href="../index.html" style="color:#3fa33d;">Products</a></li>
                    <li class="breadcrumb-item active">New Product</li>
                </ol>
            </div>

            <section class="page-hero mb-5">
                <div class="row align-items-center">
                    <div class="col-md-8 text-center text-md-start">
                        <span class="hero-eyebrow-gold"><i class="bi bi-bag-plus-fill me-2"></i>New Product</span>
                        <h1 class="display-5 fw-bold">Add a <span class="text-white">Product</span></h1>
                        <p class="lead hero-lead"><i class="bi bi-box-seam me-2" style="color:#3fa33d;"></i>Publish a new item to your catalogue.</p>
                    </div>
                    <div class="col-md-4 text-center mt-4 mt-md-0"><div class="hero-blob blob-200"><i class="bi bi-bag-plus icon-5"></i></div></div>
                </div>
            </section>

            <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
                <a href="../index.html" role="button" class="btn btn-pill-dark btn-sm"><i class="bi bi-arrow-left"></i>&nbsp;Back to Products</a>
            </div>

            <div class="row justify-content-center">
                <div class="col-md-10">
                    <div class="surface-card card-pad">
                        <form class="admin-form" data-redirect="admin/products/index.html" id="productAddForm" enctype="multipart/form-data">

                            <h6 class="form-section-heading text-green"><i class="bi bi-tag-fill"></i>Basic Information</h6>
                            <div class="row g-3 mb-4">
                                <div class="col-md-8">
                                    <label>Product Name&nbsp;<i class="bi bi-asterisk required"></i></label>
                                    <input type="text" class="form-control" placeholder="e.g. Handmade Goroka Bilum" required>
                                </div>
                                <div class="col-md-4">
                                    <label>Category&nbsp;<i class="bi bi-asterisk required"></i></label>
                                    <select class="form-select" required>
                                        <option value="">— Select Category —</option>
                                        <option>Food & Drink</option>
                                        <option>Fashion</option>
                                        <option>Home & Living</option>
                                        <option>Services</option>
                                    </select>
                                </div>
                            </div>

                            <h6 class="form-section-heading text-gold"><i class="bi bi-cash-coin"></i>Pricing & Inventory</h6>
                            <div class="row g-3 mb-4">
                                <div class="col-md-6">
                                    <label>Price (PGK)&nbsp;<i class="bi bi-asterisk required"></i></label>
                                    <div class="input-group">
                                        <span class="input-group-text" style="background-color:#191919;color:#edb400;border:none;">PGK</span>
                                        <input type="number" class="form-control" placeholder="0.00" step="0.01" min="0" required style="border-radius:0 30px 30px 0 !important;">
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <label>Inventory Count&nbsp;<i class="bi bi-asterisk required"></i></label>
                                    <div class="input-group">
                                        <span class="input-group-text" style="background-color:#191919;color:#edb400;border:none;"><i class="bi bi-box"></i></span>
                                        <input type="number" class="form-control" placeholder="e.g. 50" min="0" step="1" required style="border-radius:0 30px 30px 0 !important;">
                                    </div>
                                </div>
                            </div>

                            <h6 class="form-section-heading text-green mt-4"><i class="bi bi-images"></i>Product Images</h6>
                            <div class="row g-3 mb-4">
                                <div class="col-md-4"><label>Image 1 (Main)&nbsp;<i class="bi bi-asterisk required"></i></label><input type="file" class="form-control" accept="image/*" required></div>
                                <div class="col-md-4"><label>Image 2&nbsp;<i class="bi bi-asterisk required"></i></label><input type="file" class="form-control" accept="image/*" required></div>
                                <div class="col-md-4"><label>Image 3&nbsp;<i class="bi bi-asterisk required"></i></label><input type="file" class="form-control" accept="image/*" required></div>
                            </div>

                            <h6 class="form-section-heading text-green"><i class="bi bi-card-text"></i>Description</h6>
                            <div class="mb-4">
                                <label>Product Description&nbsp;<i class="bi bi-asterisk required"></i></label>
                                <textarea class="form-control" rows="6" placeholder="Describe the product, materials, size, origin — anything helpful for customers." required></textarea>
                                <small class="text-muted d-block mt-1"><i class="bi bi-info-circle me-1"></i>Appears on the customer-facing product page.</small>
                            </div>

                            <div class="row g-2 mt-4">
                                <div class="col-md-6"><button type="submit" class="btn btn-pill-green btn-block py-3">Create Product&nbsp;<i class="bi bi-plus-circle ms-1"></i></button></div>
                                <div class="col-md-6"><a href="../index.html" class="btn btn-pill-dark btn-block py-3">Cancel&nbsp;<i class="bi bi-x-circle ms-1"></i></a></div>
                            </div>

                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="../../../js/top-scroll.js"></script>
    <script src="../../../js/demo-cart.js"></script>
    <script src="../../../js/custom.js"></script>
    <script src="../../../js/admin-nav.js"></script>

</body>
</html>
