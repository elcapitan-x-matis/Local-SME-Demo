<!DOCTYPE html>
<html lang="en">
<head>
    <title>Products | Admin — Local SME PNG</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/quicksand@5.0.0/index.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/2.1.8/css/dataTables.bootstrap5.min.css">
    <link rel="stylesheet" href="../../css/custom.css" />
    <link rel="shortcut icon" type="icon/ico" href="../../icon/favicon.ico" />
</head>
<body data-root="../../" data-admin="true">

    <div class="container-fluid px-3 px-md-5">
        <div class="row justify-content-center">
            <div class="col-md-12">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item">Admin Panel</li>
                    <li class="breadcrumb-item active">Products</li>
                </ol>
            </div>

            <section class="page-hero mb-5">
                <div class="row align-items-center">
                    <div class="col-md-8 text-center text-md-start">
                        <span class="hero-eyebrow-gold"><i class="bi bi-bag-fill me-2"></i>Manage Inventory</span>
                        <h1 class="display-5 fw-bold">Product <span class="text-white">Catalogue</span></h1>
                        <p class="lead hero-lead"><i class="bi bi-box-seam me-2" style="color:#3fa33d;"></i>All products across the store, sorted and searchable.</p>
                    </div>
                    <div class="col-md-4 text-center mt-4 mt-md-0"><div class="hero-blob blob-200"><i class="bi bi-boxes icon-5"></i></div></div>
                </div>
            </section>

            <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
                <a href="../index.html" role="button" class="btn btn-pill-dark btn-sm"><i class="bi bi-arrow-left"></i>&nbsp;Back to Dashboard</a>
                <div class="d-flex gap-2 flex-wrap">
                    <span class="pill-count"><i class="bi bi-box-seam me-1"></i>8 Products</span>
                    <a href="add/index.html" class="btn btn-pill-green btn-sm"><i class="bi bi-plus-circle me-1"></i>New Product</a>
                </div>
            </div>

            <div class="row justify-content-center">
                <div class="col-md-12">
                    <div class="surface-card card-pad">
                        <div class="table-responsive">
                            <table id="dataTable" class="table table-styled table-hover w-100">
                                <thead>
                                    <tr>
                                        <th>Product</th>
                                        <th>Category</th>
                                        <th>Price</th>
                                        <th class="text-center">Stock</th>
                                        <th class="text-center">Status</th>
                                        <th class="text-end">Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="productRows">
                                    <!-- populated by JS from products.json -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.datatables.net/2.1.8/js/dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/2.1.8/js/dataTables.bootstrap5.min.js"></script>
    <script src="../../js/top-scroll.js"></script>
    <script src="../../js/demo-cart.js"></script>
    <script src="../../js/custom.js"></script>
    <script src="../../js/admin-nav.js"></script>
    <script src="../../js/quick-links.js"></script>

    <script>
    $(document).ready(function () {
        fetch('../../data/products.json').then(r => r.json()).then(products => {
            const tbody = document.getElementById('productRows');
            tbody.innerHTML = products.map(p => {
                const stockCell = p.inventory > 0
                    ? `<span class="pill-status-dark" style="background-color:#3fa33d;color:#fff;">${p.inventory}</span>`
                    : `<span class="pill-status-dark" style="background-color:#dc3545;color:#fff;">Out</span>`;
                const badge = p.badge === 'New' || p.badge === 'Limited' ? 'New' : 'Active';
                return `
                <tr>
                    <td>
                        <div class="d-flex align-items-center gap-2">
                            <div class="img-frame-sm"><img src="../../${p.image}" width="40" height="40" style="object-fit:cover;" alt="${p.name}"></div>
                            <div>
                                <strong style="color:#191919;display:block;">${p.name}</strong>
                                <small class="text-muted" style="font-family:'Courier New',monospace;font-size:0.72rem;">#${p.id}</small>
                            </div>
                        </div>
                    </td>
                    <td><span class="pill-category-gold" style="font-family:'Courier New',monospace;font-size:0.72rem;">${p.category}</span></td>
                    <td><span style="color:#3fa33d;font-weight:600;">PGK ${p.price.toFixed(2)}</span></td>
                    <td class="text-center">${stockCell}</td>
                    <td class="text-center"><span class="pill-status-dark">${badge}</span></td>
                    <td class="text-end">
                        <div class="table-actions justify-content-end">
                            <a href="view/index.html?id=${p.id}" class="table-action-btn table-action-view" title="View product"><i class="bi bi-eye"></i></a>
                            <a href="update/index.html?id=${p.id}" class="table-action-btn table-action-edit" title="Edit product"><i class="bi bi-pencil"></i></a>
                            <button type="button" class="table-action-btn table-action-danger admin-remove-btn" data-redirect="admin/products/index.html" title="Delete product"><i class="bi bi-trash"></i></button>
                        </div>
                    </td>
                </tr>`;
            }).join('');

            $('#dataTable').DataTable({
                "order": [[0, "asc"]],
                "pageLength": 10,
                "columnDefs": [{ "orderable": false, "targets": 5 }],
                "language": {
                    "search": "<i class='bi bi-search'></i> Search products:",
                    "lengthMenu": "Show _MENU_ entries"
                }
            });
        }).catch(err => {
            console.error('Products load error', err);
            document.getElementById('productRows').innerHTML =
                '<tr><td colspan="6" class="text-center text-danger py-4">Unable to load products.</td></tr>';
        });
    });
    </script>

</body>
</html>
