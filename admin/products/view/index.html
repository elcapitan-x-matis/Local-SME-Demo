<!DOCTYPE html>
<html lang="en">
<head>
    <title>Product Details | Admin — Local SME PNG</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/quicksand@5.0.0/index.min.css">
    <link rel="stylesheet" href="../../../css/custom.css" />
    <link rel="shortcut icon" type="icon/ico" href="../../../icon/favicon.ico" />
</head>
<body data-root="../../../" data-admin="true">

    <div class="container-fluid px-3 px-md-5">
        <div class="row justify-content-center">
            <div class="col-md-12">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item">Admin Panel</li>
                    <li class="breadcrumb-item"><a href="../index.html" style="color:#3fa33d;">Products</a></li>
                    <li class="breadcrumb-item active" id="bcName">Product</li>
                </ol>
            </div>

            <section class="page-hero mb-5">
                <div class="row align-items-center">
                    <div class="col-md-8 text-center text-md-start">
                        <span class="hero-eyebrow-gold"><i class="bi bi-box-seam me-2"></i>Product Details</span>
                        <h1 class="display-5 fw-bold" id="heroName">Product</h1>
                        <p class="lead hero-lead"><i class="bi bi-hash me-2" style="color:#3fa33d;"></i>
                            <span class="pill-category-gold" style="font-family:'Courier New',monospace;font-size:0.85rem;" id="heroId">#</span>
                        </p>
                    </div>
                    <div class="col-md-4 text-center mt-4 mt-md-0"><div class="hero-blob blob-200"><i class="bi bi-box-seam icon-5"></i></div></div>
                </div>
            </section>

            <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
                <a href="../index.html" role="button" class="btn btn-pill-dark btn-sm"><i class="bi bi-arrow-left"></i>&nbsp;Back to Products</a>
                <a href="../update/index.html" role="button" class="btn btn-pill-green btn-sm" id="editBtn"><i class="bi bi-pencil me-1"></i>Edit Product</a>
            </div>

            <div class="row justify-content-center g-4">
                <div class="col-md-4">
                    <div class="surface-card card-pad">
                        <div class="product-gallery-main mb-3">
                            <img id="mainImg" src="" alt="Main image">
                        </div>
                        <div class="row g-2">
                            <div class="col-6"><img id="thumb2" src="https://placehold.co/300x300/d0e2f0/191919?text=2" class="img-fluid rounded product-thumb" alt="Gallery 2"></div>
                            <div class="col-6"><img id="thumb3" src="https://placehold.co/300x300/d0e2f0/191919?text=3" class="img-fluid rounded product-thumb" alt="Gallery 3"></div>
                        </div>
                    </div>
                </div>
                <div class="col-md-8">
                    <div class="surface-card card-pad h-100">
                        <h5 class="mb-3" style="color:#191919;font-weight:600;">Description</h5>
                        <p id="desc" style="color:#555;">—</p>
                        <hr style="border-color:#c0d4e0;">
                        <ul class="detail-list mb-0">
                            <li><span class="detail-label"><i class="bi bi-tag"></i>Category</span><strong class="detail-value" id="category">—</strong></li>
                            <li><span class="detail-label"><i class="bi bi-shop"></i>Seller</span><strong class="detail-value" id="seller">—</strong></li>
                            <li><span class="detail-label"><i class="bi bi-cash-coin"></i>Price</span><strong class="detail-value" style="color:#3fa33d;" id="price">—</strong></li>
                            <li><span class="detail-label"><i class="bi bi-box"></i>Inventory</span><strong class="detail-value" id="inventory">—</strong></li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="../../../js/top-scroll.js"></script>
    <script src="../../../js/demo-cart.js"></script>
    <script src="../../../js/custom.js"></script>
    <script src="../../../js/admin-nav.js"></script>
    <script src="../../../js/quick-links.js"></script>

    <script>
    document.addEventListener('DOMContentLoaded', function () {
        const id = Number(new URLSearchParams(window.location.search).get('id')) || 1;
        fetch('../../../data/products.json').then(r => r.json()).then(all => {
            const p = all.find(x => x.id === id) || all[0];
            document.title = p.name + ' | Admin — Local SME PNG';
            document.getElementById('bcName').textContent = p.name;
            document.getElementById('heroName').textContent = p.name;
            document.getElementById('heroId').textContent = 'Product #' + p.id;
            document.getElementById('mainImg').src = '../../../' + p.image;
            document.getElementById('desc').textContent = p.description;
            document.getElementById('category').textContent = p.category;
            document.getElementById('seller').textContent = p.seller;
            document.getElementById('price').textContent = 'PGK ' + p.price.toFixed(2);
            document.getElementById('inventory').textContent = p.inventory + ' units';
            document.getElementById('editBtn').href = '../update/index.html?id=' + p.id;
        });
    });
    </script>

</body>
</html>
