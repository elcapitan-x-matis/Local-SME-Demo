<!DOCTYPE html>
<html lang="en">
<head>
    <title>Admin Login | Local SME PNG</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/quicksand@5.0.0/index.min.css">
    <link rel="stylesheet" href="../../css/custom.css" />
    <link rel="shortcut icon" type="icon/ico" href="../../icon/favicon.ico" />
</head>
<body data-root="../../">

    <div class="container-fluid px-3 px-md-5">
        <div class="row justify-content-center align-items-center auth-wrapper">
            <div class="col-md-8 col-lg-5">
                <div class="card auth-card">
                    <div class="card-body text-center">

                        <div class="auth-icon-badge" style="background: linear-gradient(145deg, #edb400, #d19f00);">
                            <i class="bi bi-shield-lock-fill" style="color:#191919;"></i>
                        </div>

                        <h1 class="display-6 fw-bold mb-2 auth-title">Admin Access</h1>
                        <p class="text-muted mb-4">Sign in to manage your store</p>

                        <form id="adminLoginForm">
                            <div class="form-group mb-3">
                                <div class="input-group auth-input-group">
                                    <span class="input-group-text"><i class="bi bi-person-fill"></i></span>
                                    <input type="text" id="useremail" class="form-control" placeholder="username or email…" required>
                                </div>
                            </div>

                            <div class="form-group mb-4">
                                <div class="input-group auth-input-group">
                                    <span class="input-group-text"><i class="bi bi-shield-lock-fill"></i></span>
                                    <input type="password" id="password" class="form-control" placeholder="password…" required>
                                </div>
                            </div>

                            <div class="form-group mb-3">
                                <button class="btn btn-auth-submit btn-lg btn-block w-100 py-3" type="submit">
                                    Sign In to Admin&nbsp;<i class="bi bi-arrow-right-circle ms-1"></i>
                                </button>
                            </div>
                        </form>

                        <div class="auth-divider">
                            <hr>
                            <span>RESTRICTED AREA</span>
                            <hr>
                        </div>

                        <a href="../../index.html" class="btn btn-auth-outline btn-block w-100 py-3">
                            <i class="bi bi-arrow-left me-2"></i>Back to Store
                        </a>

                        <div class="mt-4">
                            <small class="text-muted">
                                <i class="bi bi-shield-check me-1" style="color:#3fa33d;"></i>
                                Authorised personnel only.
                            </small>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="../../js/top-scroll.js"></script>
    <script src="../../js/demo-cart.js"></script>
    <script src="../../js/custom.js"></script>
    <script src="../../js/quick-links.js"></script>

    <div class="modal fade" id="systemAlertModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered"><div class="modal-content order-modal-content" style="border:2px solid #edb400;">
        <div class="modal-header order-modal-header"><h5 class="modal-title" id="alertModalTitle"><i class="bi bi-info-circle me-2"></i>System Notice</h5><button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div>
        <div class="modal-body text-center p-4"><div id="alertModalIcon" class="mb-3"><i class="bi bi-info-circle-fill" style="font-size:4rem;color:#3fa33d;"></i></div><h4 id="alertMsg" class="mb-0" style="color:#191919;font-weight:600;"></h4></div>
        <div class="modal-footer justify-content-center border-0 pb-4"><button type="button" class="btn btn-pill-green px-5" data-bs-dismiss="modal">OK</button></div>
      </div></div>
    </div>

</body>
</html>
