<!DOCTYPE html>
<html lang="en">
<head>
    <title>Account Details | Admin — Local SME PNG</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/quicksand@5.0.0/index.min.css">
    <link rel="stylesheet" href="../../css/custom.css" />
    <link rel="shortcut icon" type="icon/ico" href="../../icon/favicon.ico" />
</head>
<body data-root="../../" data-admin="true">

    <div class="container-fluid px-3 px-md-5">
        <div class="row justify-content-center">
            <div class="col-md-12">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item">Admin Panel</li>
                    <li class="breadcrumb-item active">My Account</li>
                </ol>
            </div>

            <section class="page-hero mb-5">
                <div class="row align-items-center">
                    <div class="col-md-8 text-center text-md-start">
                        <span class="hero-eyebrow-gold"><i class="bi bi-person-circle me-2"></i>My Account</span>
                        <h1 class="display-5 fw-bold">Account <span class="text-white">Details</span></h1>
                        <p class="lead hero-lead"><i class="bi bi-person-gear me-2" style="color:#3fa33d;"></i>Update your admin profile information.</p>
                    </div>
                    <div class="col-md-4 text-center mt-4 mt-md-0"><div class="profile-avatar"><i class="bi bi-person-fill"></i></div></div>
                </div>
            </section>

            <div class="row justify-content-center">
                <div class="col-md-8">
                    <div class="surface-card card-pad">
                        <form id="adminAccountForm">

                            <h6 class="form-section-heading text-green"><i class="bi bi-person-badge"></i>Personal Information</h6>
                            <div class="row g-3 mb-4">
                                <div class="col-md-6">
                                    <label>First Name&nbsp;<i class="bi bi-asterisk required"></i></label>
                                    <input type="text" class="form-control" value="Admin" required>
                                </div>
                                <div class="col-md-6">
                                    <label>Last Name&nbsp;<i class="bi bi-asterisk required"></i></label>
                                    <input type="text" class="form-control" value="User" required>
                                </div>
                            </div>

                            <h6 class="form-section-heading text-gold"><i class="bi bi-shield-lock-fill"></i>Account Credentials</h6>
                            <div class="row g-3 mb-4">
                                <div class="col-md-6">
                                    <label>Username&nbsp;<i class="bi bi-asterisk required"></i></label>
                                    <input type="text" class="form-control" value="admin" required>
                                </div>
                                <div class="col-md-6">
                                    <label>Email&nbsp;<i class="bi bi-asterisk required"></i></label>
                                    <input type="email" class="form-control" value="admin@localsme.png" required>
                                </div>
                            </div>

                            <div class="row g-2 mt-4">
                                <div class="col-md-6"><button type="submit" class="btn btn-pill-green btn-block py-3">Save Changes&nbsp;<i class="bi bi-save ms-1"></i></button></div>
                                <div class="col-md-6"><a href="../index.html" class="btn btn-pill-dark btn-block py-3">Cancel&nbsp;<i class="bi bi-x-circle ms-1"></i></a></div>
                            </div>

                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="../../js/top-scroll.js"></script>
    <script src="../../js/demo-cart.js"></script>
    <script src="../../js/custom.js"></script>
    <script src="../../js/admin-nav.js"></script>
    <script src="../../js/quick-links.js"></script>

</body>
</html>
